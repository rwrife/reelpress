name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelpress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install pinned FFmpeg for integration tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ffmpeg-test'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          curl.exe --fail --location --retry 3 `
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64 `
            --output (Join-Path $root 'ffmpeg.exe')
          curl.exe --fail --location --retry 3 `
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-win32-x64 `
            --output (Join-Path $root 'ffprobe.exe')
          if ((Get-FileHash (Join-Path $root 'ffmpeg.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '04e1307997530f9cf2fe35cba2ca7e8875ca91da02f89d6c7243df819c94ad00') { throw 'ffmpeg checksum mismatch' }
          if ((Get-FileHash (Join-Path $root 'ffprobe.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3a7e2dc003dc2cd1472827e4c7c4f056ae1ae0ae7c5bbc580c99b49827351ba4') { throw 'ffprobe checksum mismatch' }
          $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned FFmpeg for integration tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ffmpeg-test"
          mkdir -p "$root"
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch=arm64
            ffmpeg_sha=a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584
            ffprobe_sha=bb2db6f5d8cef919da12fbf592119a987202a8c060a886f3cab091f9cab90b64
          else
            arch=x64
            ffmpeg_sha=ebdddc936f61e14049a2d4b549a412b8a40deeff6540e58a9f2a2da9e6b18894
            ffprobe_sha=fa3add0ce901f7241abe0dfc0155d958fc834aca3f8ce61f87cc712ae669c1e0
          fi
          curl --fail --location --retry 3 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-$arch" --output "$root/ffmpeg"
          curl --fail --location --retry 3 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-$arch" --output "$root/ffprobe"
          echo "$ffmpeg_sha  $root/ffmpeg" | shasum -a 256 --check
          echo "$ffprobe_sha  $root/ffprobe" | shasum -a 256 --check
          chmod +x "$root/ffmpeg" "$root/ffprobe"
          echo "$root" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore ReelPress.sln
      - name: Test packaging helpers
        run: python -m unittest discover -s packaging/tests -v
      - name: Test
        run: dotnet test ReelPress.sln --configuration Release --no-restore --logger "console;verbosity=normal"

  package:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: reelpress-windows
          - os: macos-latest
            artifact: reelpress-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Compute package versions
        id: version
        shell: bash
        run: >-
          python packaging/version.py
          --ref-type "$GITHUB_REF_TYPE"
          --ref-name "$GITHUB_REF_NAME"
          --run-number "$GITHUB_RUN_NUMBER"
          >> "$GITHUB_OUTPUT"
      - name: Build Windows zip and MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./packaging/windows/package.ps1
          -OutputDirectory ./artifacts
          -PackageVersion '${{ steps.version.outputs.package_version }}'
      - name: Build universal macOS app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          ./packaging/macos/package.sh
          ./artifacts
          '${{ steps.version.outputs.display_version }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: reelpress-*
          path: artifacts
          merge-multiple: true
      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
